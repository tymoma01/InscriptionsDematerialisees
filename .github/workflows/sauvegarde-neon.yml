name: Sauvegarde quotidienne Neon

# Choix GitHub Actions plutôt qu'Azure Container Apps Jobs : pas d'infra Container Apps en place
# pour ce projet à ce stade (voir docs/sauvegarde-neon.md), alors que le dépôt est déjà sur GitHub
# — c'est l'option la plus simple à opérer aujourd'hui. À reconsidérer si une infra Container Apps
# est mise en place pour d'autres besoins.

on:
  schedule:
    # 03h00 UTC = 04h ou 05h heure de Paris selon la saison, hors usage de la tablette d'accueil
    # (CLAUDE.md : usage prévu en journée), pour ne pas faire concurrence à la charge applicative
    # avec un pg_dump complet.
    - cron: '0 3 * * *'
  workflow_dispatch: {} # déclenchement manuel depuis l'onglet Actions, pour tester sans attendre le cron

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # requis par azure/login (fédération OIDC, pas de client secret stocké)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Installer pg_dump/pg_restore (client PostgreSQL 18, aligné sur la version serveur Neon)
        # Le paquet Ubuntu générique "postgresql-client" est plafonné à une vieille version (16 sur
        # ubuntu-latest/24.04) et pg_dump refuse de dumper un serveur plus récent que lui-même
        # ("server version mismatch") — Neon est passé en Postgres 18 (voir logs du job). On installe
        # donc depuis le dépôt APT officiel PGDG (apt.postgresql.org), qui propose les paquets
        # postgresql-client-<version majeure> à jour. À REVÉRIFIER/BUMPER si Neon change à nouveau de
        # version majeure (voir docs/sauvegarde-neon.md) : le pin explicite (postgresql-client-18)
        # est volontaire, pour ne jamais dépendre silencieusement d'un "dernier disponible" qui
        # dérive du serveur au fil du temps.
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          pg_dump --version

      - name: Authentification Azure (OIDC fédéré)
        # Ouvre une session Azure CLI sur le runner via fédération d'identité OIDC (le token GitHub
        # du job, exposé grâce à `permissions.id-token: write` ci-dessus, est échangé contre un
        # jeton Azure AD — aucun client secret à générer/stocker). Service principal DÉDIÉ à ce job
        # (accès Key Vault en lecture seule, scope minimal — voir docs/sauvegarde-neon.md), distinct
        # des identités utilisées en local (az login interactif) ou en production (Managed
        # Identity). DefaultAzureCredential (backend/src/core/securite/keyVaultClient.js) retombe
        # sur AzureCliCredential et retrouve cette session automatiquement à l'étape suivante, sans
        # code spécifique à ajouter pour CI.
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Exécuter la sauvegarde
        env:
          SAUVEGARDE_EMAIL_ALERTE: ${{ secrets.SAUVEGARDE_EMAIL_ALERTE }}
        run: node scripts/sauvegarderNeon.js
